<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Демонстрация экрана</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #141517;
    color: #f5f5f7;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 14px 18px;
    font-size: 15px;
    font-weight: 600;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .close {
    background: none;
    border: none;
    color: rgba(245,245,247,0.6);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 2px 6px;
  }
  .close:hover { color: #fff; }
  .grid {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
    align-content: start;
  }
  .src {
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    overflow: hidden;
    background: rgba(255,255,255,0.04);
    cursor: pointer;
    transition: border-color 0.12s ease, transform 0.1s ease;
  }
  .src:hover { border-color: rgba(255,255,255,0.4); transform: translateY(-1px); }
  .src:active { transform: scale(0.98); }
  .thumb {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: contain;
    background: #000;
    display: block;
  }
  .no-thumb {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(245,245,247,0.35);
    font-size: 13px;
  }
  .name {
    padding: 8px 10px;
    font-size: 12.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .empty {
    text-align: center;
    color: rgba(245,245,247,0.5);
    padding: 40px 20px;
    font-size: 14px;
    grid-column: 1 / -1;
  }
</style>
</head>
<body>
<header>
  <span>Что показать?</span>
  <button class="close" title="Отмена" onclick="cancel()">✕</button>
</header>
<div class="grid" id="grid"><div class="empty">Загрузка источников…</div></div>
<script>
  async function load() {
    const grid = document.getElementById("grid");
    try {
      const sources = await window.pickerAPI.list();
      if (!sources || sources.length === 0) {
        grid.innerHTML = '<div class="empty">Источники не найдены</div>';
        return;
      }
      grid.innerHTML = "";
      for (const s of sources) {
        const card = document.createElement("div");
        card.className = "src";
        card.title = s.name;
        if (s.thumbnail) {
          const img = document.createElement("img");
          img.className = "thumb";
          img.src = s.thumbnail;
          card.appendChild(img);
        } else {
          const nt = document.createElement("div");
          nt.className = "no-thumb";
          nt.textContent = "Нет превью";
          card.appendChild(nt);
        }
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = s.name;
        card.appendChild(name);
        card.addEventListener("click", () => window.pickerAPI.select(s.id));
        grid.appendChild(card);
      }
    } catch (err) {
      grid.innerHTML = '<div class="empty">Не удалось получить источники</div>';
    }
  }
  function cancel() {
    window.pickerAPI.cancel();
  }
  load();
</script>
</body>
</html>
