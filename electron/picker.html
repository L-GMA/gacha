<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Демонстрация экрана</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #141517;
    color: #f5f5f7;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 12px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    gap: 12px;
  }
  .tabs {
    display: flex;
    gap: 6px;
  }
  .tab {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(245,245,247,0.7);
    border-radius: 9px;
    padding: 7px 16px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .tab:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .tab.active {
    background: rgba(255,255,255,0.16);
    color: #fff;
    border-color: rgba(255,255,255,0.22);
  }
  .close {
    background: none;
    border: none;
    color: rgba(245,245,247,0.6);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 2px 6px;
  }
  .close:hover { color: #fff; }
  .grid {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
    align-content: start;
  }
  .src {
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    overflow: hidden;
    background: rgba(255,255,255,0.04);
    cursor: pointer;
    transition: border-color 0.12s ease, transform 0.1s ease;
  }
  .src:hover { border-color: rgba(255,255,255,0.4); transform: translateY(-1px); }
  .src:active { transform: scale(0.98); }
  .thumb {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: contain;
    background: #000;
    display: block;
  }
  .no-thumb {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(245,245,247,0.35);
    font-size: 13px;
  }
  .name {
    padding: 8px 10px;
    font-size: 12.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .empty {
    text-align: center;
    color: rgba(245,245,247,0.5);
    padding: 40px 20px;
    font-size: 14px;
    grid-column: 1 / -1;
  }
  .footer {
    padding: 10px 18px;
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }
  .qsel {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .qsel label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: rgba(245,245,247,0.7);
  }
  .qsel select {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #f5f5f7;
    border-radius: 8px;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .qsel select:focus { outline: none; border-color: rgba(255,255,255,0.35); }
  .hint {
    font-size: 12px;
    color: rgba(245,245,247,0.45);
  }
</style>
</head>
<body>
<header>
  <div class="tabs">
    <button class="tab active" id="tab-screen" onclick="showTab('screen')">Экран</button>
    <button class="tab" id="tab-window" onclick="showTab('window')">Окно</button>
  </div>
  <button class="close" title="Отмена" onclick="cancel()">✕</button>
</header>
<div class="grid" id="grid"><div class="empty">Загрузка источников…</div></div>
<footer class="footer">
  <div class="qsel">
    <label>Качество
      <select id="quality">
        <option value="720">720p</option>
        <option value="1080">1080p</option>
      </select>
    </label>
    <label>Частота кадров
      <select id="fps">
        <option value="30">30 fps</option>
        <option value="60">60 fps</option>
        <option value="90">90 fps</option>
      </select>
    </label>
  </div>
  <div class="hint">Выберите источник</div>
</footer>
<script>
  var currentTab = "screen";
  var data = { screens: [], windows: [] };

  function makeCard(s, label) {
    var card = document.createElement("div");
    card.className = "src";
    card.title = label;
    if (s.thumbnail) {
      var img = document.createElement("img");
      img.className = "thumb";
      img.src = s.thumbnail;
      card.appendChild(img);
    } else {
      var nt = document.createElement("div");
      nt.className = "no-thumb";
      nt.textContent = "Нет превью";
      card.appendChild(nt);
    }
    var name = document.createElement("div");
    name.className = "name";
    name.textContent = label;
    card.appendChild(name);
    card.addEventListener("click", function () {
      var q = document.getElementById("quality").value;
      var f = Number(document.getElementById("fps").value);
      window.pickerAPI.select(s.id, q, f);
    });
    return card;
  }

  function render() {
    var grid = document.getElementById("grid");
    var list = currentTab === "screen" ? data.screens : data.windows;
    if (!list || list.length === 0) {
      grid.innerHTML =
        currentTab === "screen"
          ? '<div class="empty">Мониторы не найдены</div>'
          : '<div class="empty">Открытые окна не найдены</div>';
      return;
    }
    grid.innerHTML = "";
    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      var label =
        currentTab === "screen"
          ? "Монитор " + (i + 1) + (s.name ? " — " + s.name : "")
          : s.name;
      grid.appendChild(makeCard(s, label));
    }
  }

  async function load() {
    var grid = document.getElementById("grid");
    try {
      var res = await window.pickerAPI.list();
      data.screens = res.screens || [];
      data.windows = res.windows || [];
      if (res.prefs) {
        document.getElementById("quality").value =
          res.prefs.quality === "720" ? "720" : "1080";
        document.getElementById("fps").value =
          res.prefs.fps === 90 ? "90" : res.prefs.fps === 60 ? "60" : "30";
      }
      render();
    } catch (err) {
      grid.innerHTML = '<div class="empty">Не удалось получить источники</div>';
    }
  }

  function showTab(tab) {
    currentTab = tab;
    document.getElementById("tab-screen").classList.toggle("active", tab === "screen");
    document.getElementById("tab-window").classList.toggle("active", tab === "window");
    render();
  }

  function cancel() {
    window.pickerAPI.cancel();
  }

  load();
</script>
</body>
</html>
