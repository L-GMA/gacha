<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: #000000;
      color: #f5f5f7;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
    }
    .splash {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 28px;
    }
    .logo {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #ffffff;
    }
    .version {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: rgba(235, 235, 245, 0.45);
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }
    .spinner {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      font-size: 13px;
      color: rgba(235, 235, 245, 0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pct {
      margin-left: auto;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
    }
    .bar-wrap {
      width: 100%;
      max-width: 320px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }
    .bar {
      height: 100%;
      width: 0;
      border-radius: 2px;
      background: #ffffff;
      transition: width 0.2s ease;
    }
    .close {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(235, 235, 245, 0.7);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      -webkit-app-region: no-drag;
      transition: background 0.15s, color 0.15s;
    }
    .close:hover { background: rgba(255, 255, 255, 0.16); color: #ffffff; }
  </style>
</head>
<body>
  <button class="close" id="close" title="Пропустить обновление">×</button>
  <div class="splash">
    <div class="logo">GACHA</div>
    <div class="version" id="version"></div>
    <div class="bar-wrap" id="bar-wrap" style="display: none;">
      <div class="bar" id="bar"></div>
    </div>
    <div class="status-row">
      <div class="spinner" id="spinner"></div>
      <div class="status" id="status">Запуск…</div>
      <div class="pct" id="pct"></div>
    </div>
  </div>

  <script>
    const versionEl = document.getElementById("version");
    const statusEl = document.getElementById("status");
    const spinnerEl = document.getElementById("spinner");
    const barWrap = document.getElementById("bar-wrap");
    const bar = document.getElementById("bar");
    const pctEl = document.getElementById("pct");

    window.desktop.getVersion().then((v) => {
      versionEl.textContent = "Версия " + v;
    }).catch(() => {});

    document.getElementById("close").addEventListener("click", () => {
      window.desktop.skipUpdate();
    });

    window.desktop.onUpdateStatus((s) => {
      statusEl.textContent = s.message || "";
      if (typeof s.progress === "number") {
        spinnerEl.style.display = "none";
        barWrap.style.display = "block";
        bar.style.width = Math.round(s.progress * 100) + "%";
        pctEl.textContent = Math.round(s.progress * 100) + "%";
      } else {
        barWrap.style.display = "none";
        pctEl.textContent = "";
        spinnerEl.style.display = "block";
      }
    });
  </script>
</body>
</html>
